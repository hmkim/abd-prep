[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abd-prep"
dynamic = ["version"]
description = "Prepare and validate Amazon Bio Discovery inputs: PDB structures (target + antibody Fv), FASTA seed antibodies, and assay CSVs. Standard library only."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Hyunmin Kim", email = "hyunmink@amazon.com"}]
keywords = ["bioinformatics", "pdb", "fasta", "antibody", "structural-biology", "antibody-engineering", "amazon-bio-discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hmkim/abd-prep"
Repository = "https://github.com/hmkim/abd-prep"
Issues = "https://github.com/hmkim/abd-prep/issues"

[project.scripts]
abd-prep = "abd_prep.cli:main"

[tool.setuptools.packages.find]
include = ["abd_prep*"]

[tool.setuptools.dynamic]
version = {attr = "abd_prep.__version__"}
